name: Build TWRP scout

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "Rama del minimal manifest de TWRP"
        default: "twrp-14.1"
      BUILD_TARGET:
        description: "Objetivo de compilacion"
        default: "vendorbootimage"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Liberar espacio en disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
            python-is-python3 ccache bc libncurses5 rsync lz4
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "twrp-builder"
          git config --global user.email "twrp-builder@users.noreply.github.com"

      - name: Sincronizar el minimal manifest de TWRP
        run: |
          mkdir -p "$HOME/twrp"
          cd "$HOME/twrp"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "${{ inputs.MANIFEST_BRANCH }}"
          repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags

      - name: Traer el device tree de este repositorio
        run: |
          cd "$HOME/twrp"
          git clone "https://github.com/${{ github.repository }}" -b "${{ github.ref_name }}" device/motorola/scout

      - name: Compilar
        shell: bash
        run: |
          cd "$HOME/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          ls build/release || true
          ok=0
          for rel in ap1a ap2a ap3a up1a trunk_staging; do
            echo "Probando lunch twrp_scout-$rel-eng"
            if lunch "twrp_scout-$rel-eng"; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then echo "Ningun lunch funciono"; exit 1; fi
          mka "${{ inputs.BUILD_TARGET }}" -j"$(nproc --all)"

      - name: Subir imagenes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-scout
          path: /home/runner/twrp/out/target/product/*/*.img
          if-no-files-found: warn
